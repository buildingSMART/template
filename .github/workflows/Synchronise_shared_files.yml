name: Synchronise shared files

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-shared-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # - repository: IFC4.x-development
          #   extra_branches: ""
            
          # - repository: IFC4.x-tooling
          #   extra_branches: ""
            
          - repository: BCF-XML
            extra_branches: ""
            
          - repository: BCF-API
            extra_branches: ""
            
          # - repository: IDS
          #   extra_branches: ""
            
          # - repository: foundation-API
          #   extra_branches: ""
                        
          # - repository: documents-API
          #   extra_branches: ""
            
          # - repository: Standards-builds
          #   extra_branches: ""
            
          # - repository: technical.buildingsmart.org
          #   extra_branches: ""
            
          # - repository: bSDD
          #   extra_branches: ""
            
          # - repository: validate
          #   extra_branches: ""
            
          # - repository: ifc-validation-data-model
          #   extra_branches: ""
            
          # - repository: ifc-gherkin-rules
          #   extra_branches: ""
          
          # - repository: certification-scorecards
          #   extra_branches: ""
            
          # - repository: Certification-datasets
          #   extra_branches: ""
                      
          # - repository: IFC4.x-IF
          #   extra_branches: ""
            
          # - repository: IFCX-CORE
          #   extra_branches: ""
            
          # - repository: IFC5-development
          #   extra_branches: ""
            
          # - repository: IFC4.x-specification-models
          #   extra_branches: ""
            
          # - repository: Simple-Sample-Scene-Models
          #   extra_branches: ""
            
          # - repository: IFC-translations
          #   extra_branches: ""
            
          # - repository: bSI-notes
          #   extra_branches: ""
            
          # - repository: IDS-Audit-tool
          #   extra_branches: ""
            
          # - repository: pcert-practitioner-task-review-tool
          #   extra_branches: ""
            
          # - repository: integration-work
          #   extra_branches: ""
            
          # - repository: ifcx.dev
          #   extra_branches: ""
                  
          # - repository: openBIM_Practitioner_exam_evaluation
          #   extra_branches: ""
            
          # - repository: New-Sample-Test-Files
          #   extra_branches: ""
                      
          # - repository: mvdXML
          #   extra_branches: ""
            
          # - repository: NextGen-IFC 

          # - repository: cla-signatures
          #   extra_branches: ""
            
          # - repository: cla-manager
          #   extra_branches: ""
          
          # - repository: clabot-config
          #   extra_branches: ""
            
          # - repository: example-repo-3
          #   extra_branches: "develop release"

    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      ORGANIZATION: ${{ github.repository_owner }}
      REPOSITORY: ${{ matrix.repository }}
      EXTRA_BRANCHES: ${{ matrix.extra_branches }}

    steps:
      - name: Checkout template repository
        uses: actions/checkout@v4

      - name: Synchronise files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$GITHUB_WORKSPACE"
          TARGET="$ORGANIZATION/$REPOSITORY"

          # Discover all tracked files
          FILES=()

          # Select what to skip
          EXCLUDE=(
            "README.md"
            ".github/workflows/*"
            ".github/CODEOWNERS"
            # "LICENSE.md"
            # "AGENTS.md"
            # ".github/PULL_REQUEST_TEMPLATE.md"
            # ".github/GOVERNANCE.md"
            # ".github/FUNDING.yml"
            # ".github/BRANCHING.md"
          )

          # Exclude from the rest:          
          while IFS= read -r -d '' FILE; do
            SKIP=false
          
            for PATTERN in "${EXCLUDE[@]}"; do
              if [[ "$FILE" == $PATTERN ]]; then
                SKIP=true
                break
              fi
            done
          
            if [ "$SKIP" = false ]; then
              FILES+=("$FILE")
            fi
          
          done < <(git -C "$SOURCE" ls-files -z)
          
          # Display files selected for synchronisation
          printf 'Synchronizing: %s\n' "${FILES[@]}"

          # Validate source files
          for FILE in "${FILES[@]}"; do
            test -f "$SOURCE/$FILE"
          done

          # Detect default branch
          DEFAULT_BRANCH=$(gh repo view "$TARGET" \
            --json defaultBranchRef \
            --jq '.defaultBranchRef.name')

          # Configure authentication
          gh auth setup-git

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Clone target repository
          gh repo clone "$TARGET" "$RUNNER_TEMP/target"
          cd "$RUNNER_TEMP/target"

          # Combine default and additional branches
          BRANCHES=$(printf '%s\n' \
            "$DEFAULT_BRANCH" $EXTRA_BRANCHES | sort -u)

          for BRANCH in $BRANCHES; do

            SYNC_BRANCH="sync-from-template"

            git fetch origin

            git checkout -B "$SYNC_BRANCH" "origin/$BRANCH"

            # Copy shared files
            for FILE in "${FILES[@]}"; do
              mkdir -p "$(dirname "$FILE")"
              cp "$SOURCE/$FILE" "$FILE"
              git add -- "$FILE"
            done

            # Skip if nothing changed
            if git diff --cached --quiet; then
              echo "$TARGET ($BRANCH): Already synchronised"
              continue
            fi

            git commit -m "Synchronise shared template files"

            git push --force-with-lease origin "$SYNC_BRANCH"

            # Check for existing pull request
            PR=$(gh pr list \
              --repo "$TARGET" \
              --base "$BRANCH" \
              --head "$SYNC_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty')

            if [ -z "$PR" ]; then
              gh pr create \
                --repo "$TARGET" \
                --base "$BRANCH" \
                --head "$SYNC_BRANCH" \
                --title "Synchronise shared template files" \
                --body "Automated synchronisation from the central template repository."
            else
              echo "Updated existing pull request #$PR"
            fi

          done
