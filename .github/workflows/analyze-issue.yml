name: Analyze Issue Discussion

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to analyze
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  analyze-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze issue discussion
        id: analyze
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = Number('${{ inputs.issue_number }}');
            const { owner, repo } = context.repo;

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(`Invalid issue number: '${{ inputs.issue_number }}'`);
              return;
            }

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const textParts = [];
            if (issue.data.title) textParts.push(`Title: ${issue.data.title}`);
            if (issue.data.body) textParts.push(issue.data.body);
            comments.data.forEach((comment, index) => {
              textParts.push(`COMMENT ${index + 1}: ${comment.body || ''}`);
            });

            const discussion = textParts.join('\n\n').toLowerCase();

            const clearResolutionPatterns = [
              'resolved by',
              'fixed by',
              'implemented in',
              'will be fixed',
              'duplicate of',
              'not a bug',
              'working as intended',
              'closing as',
              'won\\'t fix',
              'root cause is',
              'issue was caused by',
              'this is expected behavior',
            ];

            const clearSolutionPatterns = [
              'solution is',
              'the fix is',
              'we should',
              'proposed fix',
              'should be changed',
              'should do',
              'the correct approach is',
              'workaround is',
              'the mitigation is',
              'this can be solved by',
              'resolve by',
              'fix by',
              'the root cause is',
            ];

            const weakSolutionPatterns = [
              'maybe',
              'perhaps',
              'could try',
              'i think',
              'likely',
              'possibly',
            ];

            let clearResolutionHits = 0;
            let clearSolutionHits = 0;
            let weakHits = 0;

            for (const pattern of clearResolutionPatterns) {
              if (discussion.includes(pattern)) clearResolutionHits++;
            }

            for (const pattern of clearSolutionPatterns) {
              if (discussion.includes(pattern)) clearSolutionHits++;
            }

            for (const pattern of weakSolutionPatterns) {
              if (discussion.includes(pattern)) weakHits++;
            }

            let status = 'INCONCLUSIVE';
            let conclusion = 'The discussion does not provide a clear, actionable resolution.';

            if (clearResolutionHits > 0 || issue.data.state === 'closed') {
              status = 'CLEAR_RESOLUTION';
              conclusion = 'The discussion clearly points to a resolution or closure, with enough evidence to resolve the issue.';
            } else if (clearSolutionHits >= 2) {
              status = 'CLEAR_SOLUTION';
              conclusion = 'The discussion contains a clear, actionable solution and the expected resolution path is well defined.';
            } else if (clearSolutionHits === 1 && weakHits <= 1) {
              status = 'PARTIAL_SOLUTION';
              conclusion = 'There is some guidance toward a solution, but it is not definitive or fully supported.';
            }

            const issueTitle = issue.data.title || '(untitled issue)';
            const issueBody = issue.data.body || '(no description provided)';
            const commentCount = comments.data.length;

            const markdown = `
## Issue Analysis Result

- Status: \`${status}\`
- Issue: #${issueNumber} — ${issueTitle}
- Comments reviewed: ${commentCount}

### Conclusion
${conclusion}

### Issue description
${issueBody || '(no description)'}

### Summary of discussion
The workflow reviewed the original issue text and all comments. It classified the thread as:
- ${status === 'CLEAR_RESOLUTION' ? 'Clear resolution' : status === 'CLEAR_SOLUTION' ? 'Clear solution' : status === 'PARTIAL_SOLUTION' ? 'Partial solution' : 'Inconclusive'}
- ${conclusion}

This assessment is based on the issue text and comments only.
`;

            await core.summary
              .addHeading(`Issue #${issueNumber} analysis`)
              .addRaw(`Status: \`${status}\`\n`)
              .addRaw(`Conclusion: ${conclusion}\n`)
              .write();

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: markdown,
            });

            core.setOutput('status', status);
            core.setOutput('conclusion', conclusion);

      - name: Print final result
        run: |
          echo "Status: ${{ steps.analyze.outputs.status }}"
          echo "Conclusion: ${{ steps.analyze.outputs.conclusion }}"
